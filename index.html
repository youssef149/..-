<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPS Online</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, #263b72, transparent 45%),
        linear-gradient(135deg, #070b18, #101a35);
      color: white;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 600px;
    }

    header {
      text-align: center;
      margin: 20px 0 25px;
    }

    header h1 {
      font-size: 38px;
      margin-bottom: 8px;
    }

    header p {
      color: #aeb9d8;
    }

    .card {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(15px);
      border-radius: 25px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h2 {
      margin-bottom: 18px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #43517b;
      background: rgba(0,0,0,.3);
      color: white;
      outline: none;
      font-size: 17px;
      margin-bottom: 12px;
      text-align: center;
    }

    button {
      border: none;
      border-radius: 15px;
      padding: 14px 20px;
      font-size: 17px;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, #2878ff, #6248ff);
      width: 100%;
      margin-top: 8px;
      transition: .2s;
    }

    button:active {
      transform: scale(.97);
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .secondary {
      background: rgba(255,255,255,.1);
    }

    .room-code {
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      letter-spacing: 5px;
      color: #66a3ff;
      margin: 15px 0;
    }

    .status {
      text-align: center;
      padding: 14px;
      border-radius: 15px;
      background: rgba(0,0,0,.25);
      color: #dce5ff;
      margin-bottom: 15px;
      line-height: 1.7;
    }

    .players {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .player {
      flex: 1;
      padding: 15px;
      border-radius: 18px;
      text-align: center;
      background: rgba(255,255,255,.07);
    }

    .player.active {
      border: 1px solid #4c91ff;
      box-shadow: 0 0 20px rgba(76,145,255,.2);
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .choice {
      font-size: 42px;
      padding: 18px 5px;
      background: rgba(255,255,255,.08);
    }

    .choice span {
      display: block;
      font-size: 14px;
      margin-top: 7px;
    }

    .result {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      padding: 20px;
      border-radius: 18px;
      background: rgba(0,0,0,.25);
      margin-top: 18px;
    }

    .score {
      display: flex;
      justify-content: space-around;
      font-size: 21px;
      margin-top: 15px;
    }

    .hidden {
      display: none !important;
    }

    .copy {
      background: linear-gradient(135deg, #00a86b, #00c987);
    }

    .danger {
      background: linear-gradient(135deg, #d7355f, #ff416c);
    }

    .small {
      color: #aeb9d8;
      font-size: 14px;
      text-align: center;
      margin-top: 10px;
    }

    @media(max-width: 420px) {
      header h1 {
        font-size: 30px;
      }

      .choice {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header>
    <h1>🎮 RPS Online</h1>
    <p>حجر 🪨 ورقة 📄 مقص ✂️</p>
  </header>

  <!-- تسجيل الدخول -->
  <div id="loadingCard" class="card">
    <div class="status">⏳ جاري الاتصال بالسيرفر...</div>
  </div>

  <!-- الصفحة الرئيسية -->
  <div id="home" class="hidden">

    <div class="card">
      <h2>🎮 العب أونلاين</h2>

      <button id="createRoomBtn">
        ➕ إنشاء غرفة
      </button>

      <div style="text-align:center;margin:15px 0;color:#aaa;">
        أو
      </div>

      <input
        id="roomInput"
        maxlength="6"
        placeholder="اكتب كود الغرفة"
        autocomplete="off"
      >

      <button id="joinRoomBtn">
        🚪 دخول الغرفة
      </button>
    </div>

  </div>

  <!-- الغرفة -->
  <div id="game" class="hidden">

    <div class="card">

      <h2>🏠 غرفة اللعب</h2>

      <div class="room-code" id="roomCode">
        ------
      </div>

      <button class="copy" id="copyBtn">
        📋 نسخ كود الغرفة
      </button>

      <p class="small">
        ابعت الكود للاعب الثاني
      </p>

    </div>

    <div class="card">

      <div class="players">

        <div class="player active">
          👤 أنت
          <br>
          <span id="youStatus">جاهز</span>
        </div>

        <div class="player">
          👤 اللاعب الثاني
          <br>
          <span id="opponentStatus">جاري الانتظار...</span>
        </div>

      </div>

      <div class="status" id="status">
        في انتظار اللاعب الثاني...
      </div>

      <div id="choicesArea">

        <h2>اختار 👇</h2>

        <div class="choices">

          <button class="choice" data-choice="rock">
            🪨
            <span>حجر</span>
          </button>

          <button class="choice" data-choice="paper">
            📄
            <span>ورقة</span>
          </button>

          <button class="choice" data-choice="scissors">
            ✂️
            <span>مقص</span>
          </button>

        </div>

      </div>

      <div id="result" class="result hidden"></div>

      <div class="score">
        <div>
          أنت:
          <strong id="myScore">0</strong>
        </div>

        <div>
          الخصم:
          <strong id="opponentScore">0</strong>
        </div>
      </div>

      <button id="againBtn" class="hidden">
        🔄 جولة جديدة
      </button>

      <button id="leaveBtn" class="danger">
        🚪 الخروج من الغرفة
      </button>

    </div>

  </div>

</div>


<script type="module">

  /* =====================================================
     FIREBASE
  ===================================================== */

  import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

  import {
    getAuth,
    signInAnonymously,
    onAuthStateChanged
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

  import {
    getDatabase,
    ref,
    set,
    get,
    update,
    remove,
    onValue,
    runTransaction,
    onDisconnect
  }
  from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";


  /* =====================================================
     FIREBASE CONFIG
     ===================================================== */

  const firebaseConfig = {

    apiKey: "AIzaSyAUV_pAXMCjUVLPVNUGnAGkbu9De39nEEU",

    authDomain:
      "rps-online-785fc.firebaseapp.com",

    databaseURL:
      "https://rps-online-785fc-default-rtdb.firebaseio.com",

    projectId:
      "rps-online-785fc",

    storageBucket:
      "rps-online-785fc.firebasestorage.app",

    messagingSenderId:
      "832559985038",

    appId:
      "1:832559985038:web:ebdc8da7c7f4c7a9ef34df",

    measurementId:
      "G-76XM3GND1Y"
  };


  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getDatabase(app);


  /* =====================================================
     VARIABLES
     ===================================================== */

  let currentUser = null;

  let currentRoom = null;

  let myPlayer = null;

  let roomListener = null;

  let myScore = 0;

  let opponentScore = 0;

  let currentRound = 1;


  /* =====================================================
     ELEMENTS
     ===================================================== */

  const loadingCard =
    document.getElementById("loadingCard");

  const home =
    document.getElementById("home");

  const game =
    document.getElementById("game");

  const createRoomBtn =
    document.getElementById("createRoomBtn");

  const joinRoomBtn =
    document.getElementById("joinRoomBtn");

  const roomInput =
    document.getElementById("roomInput");

  const roomCode =
    document.getElementById("roomCode");

  const status =
    document.getElementById("status");

  const youStatus =
    document.getElementById("youStatus");

  const opponentStatus =
    document.getElementById("opponentStatus");

  const result =
    document.getElementById("result");

  const againBtn =
    document.getElementById("againBtn");

  const leaveBtn =
    document.getElementById("leaveBtn");

  const copyBtn =
    document.getElementById("copyBtn");

  const myScoreEl =
    document.getElementById("myScore");

  const opponentScoreEl =
    document.getElementById("opponentScore");

  const choicesArea =
    document.getElementById("choicesArea");


  /* =====================================================
     LOGIN ANONYMOUS
     ===================================================== */

  signInAnonymously(auth)
    .catch(error => {

      console.error(error);

      alert(
        "حدث خطأ في الاتصال بـ Firebase\n" +
        error.message
      );

    });


  onAuthStateChanged(auth, user => {

    if (!user) return;

    currentUser = user;

    loadingCard.classList.add("hidden");

    home.classList.remove("hidden");

  });


  /* =====================================================
     CREATE ROOM CODE
     ===================================================== */

  function generateRoomCode() {

    const chars =
      "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for(let i = 0; i < 6; i++) {

      code +=
        chars[Math.floor(Math.random() * chars.length)];

    }

    return code;

  }


  /* =====================================================
     CREATE ROOM
     ===================================================== */

  createRoomBtn.addEventListener("click", async () => {

    createRoomBtn.disabled = true;

    try {

      let code = generateRoomCode();

      const roomRef =
        ref(db, "rooms/" + code);

      await set(roomRef, {

        createdAt: Date.now(),

        status: "waiting",

        round: 1,

        player1: {

          uid: currentUser.uid,

          choice: null,

          ready: true

        },

        player2: null,

        result: null

      });

      currentRoom = code;

      myPlayer = "player1";

      await setupDisconnect();

      openGame();

      listenToRoom();

    }
    catch(error) {

      console.error(error);

      alert(
        "حصل خطأ أثناء إنشاء الغرفة:\n" +
        error.message
      );

    }

    createRoomBtn.disabled = false;

  });


  /* =====================================================
     JOIN ROOM
     ===================================================== */

  joinRoomBtn.addEventListener("click", async () => {

    const code =
      roomInput.value
        .trim()
        .toUpperCase();

    if(code.length !== 6) {

      alert("اكتب كود الغرفة المكون من 6 حروف/أرقام");

      return;

    }

    joinRoomBtn.disabled = true;

    try {

      const roomRef =
        ref(db, "rooms/" + code);

      const snapshot =
        await get(roomRef);

      if(!snapshot.exists()) {

        alert("الغرفة غير موجودة");

        joinRoomBtn.disabled = false;

        return;

      }

      const room =
        snapshot.val();

      if(room.player2) {

        alert("الغرفة ممتلئة بالفعل");

        joinRoomBtn.disabled = false;

        return;

      }

      /*
        Transaction تمنع دخول لاعبين اثنين
        في نفس اللحظة إلى نفس المكان.
      */

      const transaction =
        await runTransaction(roomRef, currentData => {

          if(currentData === null) {

            return;

          }

          if(currentData.player2) {

            return;

          }

          currentData.player2 = {

            uid: currentUser.uid,

            choice: null,

            ready: true

          };

          currentData.status = "playing";

          return currentData;

        });


      if(!transaction.committed) {

        alert("لم نستطع دخول الغرفة، حاول مرة أخرى");

        joinRoomBtn.disabled = false;

        return;

      }

      currentRoom = code;

      myPlayer = "player2";

      await setupDisconnect();

      openGame();

      listenToRoom();

    }
    catch(error) {

      console.error(error);

      alert(
        "حصل خطأ أثناء دخول الغرفة:\n" +
        error.message
      );

    }

    joinRoomBtn.disabled = false;

  });


  /* =====================================================
     OPEN GAME
     ===================================================== */

  function openGame() {

    home.classList.add("hidden");

    game.classList.remove("hidden");

    roomCode.textContent =
      currentRoom;

    result.classList.add("hidden");

    againBtn.classList.add("hidden");

    choicesArea.classList.remove("hidden");

  }


  /* =====================================================
     DISCONNECT
     ===================================================== */

  async function setupDisconnect() {

    const playerRef =
      ref(
        db,
        `rooms/${currentRoom}/${myPlayer}`
      );

    await onDisconnect(playerRef).remove();

  }


  /* =====================================================
     LISTEN TO ROOM
     ===================================================== */

  function listenToRoom() {

    const roomRef =
      ref(
        db,
        "rooms/" + currentRoom
      );

    roomListener =
      onValue(roomRef, snapshot => {

        if(!snapshot.exists()) {

          alert("الغرفة انتهت");

          location.reload();

          return;

        }

        const room =
          snapshot.val();

        updateGame(room);

      });

  }


  /* =====================================================
     UPDATE GAME
     ===================================================== */

  function updateGame(room) {

    const me =
      room[myPlayer];

    const opponentPlayer =
      myPlayer === "player1"
        ? "player2"
        : "player1";

    const opponent =
      room[opponentPlayer];


    /* اللاعب الثاني لم يدخل */

    if(!opponent) {

      status.textContent =
        "⏳ في انتظار اللاعب الثاني...";

      opponentStatus.textContent =
        "جاري الانتظار...";

      disableChoices(true);

      return;

    }


    opponentStatus.textContent =
      opponent.choice
        ? "اختار ✅"
        : "يفكر...";


    /* بداية الجولة */

    if(
      room.status === "playing" &&
      !room.result
    ) {

      status.textContent =
        me.choice
          ? "⏳ اخترت! في انتظار اختيار اللاعب الثاني..."
          : "🎯 اختار حجر أو ورقة أو مقص";

      disableChoices(!!me.choice);

      result.classList.add("hidden");

      againBtn.classList.add("hidden");

    }


    /* النتيجة */

    if(room.result) {

      disableChoices(true);

      showResult(
        room.result,
        room,
        me,
        opponent
      );

    }

  }


  /* =====================================================
     CHOOSE
     ===================================================== */

  document.querySelectorAll(".choice")
    .forEach(button => {

      button.addEventListener("click", async () => {

        if(!currentRoom) return;

        const choice =
          button.dataset.choice;

        const choiceRef =
          ref(
            db,
            `rooms/${currentRoom}/${myPlayer}/choice`
          );

        try {

          await set(choiceRef, choice);

          /*
            بعد اختيار اللاعب، نحاول حساب النتيجة.
          */

          await calculateResult();

        }
        catch(error) {

          console.error(error);

          alert("حدث خطأ أثناء تسجيل الاختيار");

        }

      });

    });


  /* =====================================================
     CALCULATE RESULT
     ===================================================== */

  async function calculateResult() {

    const roomRef =
      ref(
        db,
        "rooms/" + currentRoom
      );

    const snapshot =
      await get(roomRef);

    if(!snapshot.exists()) return;

    const room =
      snapshot.val();

    if(!room.player1 || !room.player2)
      return;

    if(
      !room.player1.choice ||
      !room.player2.choice
    ) {

      return;

    }

    if(room.result)
      return;


    const p1 =
      room.player1.choice;

    const p2 =
      room.player2.choice;

    let winner = "draw";


    if(p1 === p2) {

      winner = "draw";

    }
    else if(

      (p1 === "rock" &&
       p2 === "scissors")

      ||

      (p1 === "paper" &&
       p2 === "rock")

      ||

      (p1 === "scissors" &&
       p2 === "paper")

    ) {

      winner = "player1";

    }
    else {

      winner = "player2";

    }


    /*
      Transaction تمنع حساب النتيجة مرتين.
    */

    await runTransaction(
      ref(
        db,
        `rooms/${currentRoom}/result`
      ),

      currentResult => {

        if(currentResult !== null)
          return;

        return {

          winner: winner,

          player1Choice: p1,

          player2Choice: p2,

          time: Date.now()

        };

      }
    );

  }


  /* =====================================================
     SHOW RESULT
     ===================================================== */

  function showResult(
    gameResult,
    room,
    me,
    opponent
  ) {

    result.classList.remove("hidden");

    choicesArea.classList.add("hidden");

    const myChoice =
      myPlayer === "player1"
        ? gameResult.player1Choice
        : gameResult.player2Choice;

    const opponentChoice =
      myPlayer === "player1"
        ? gameResult.player2Choice
        : gameResult.player1Choice;


    const names = {

      rock: "🪨 حجر",

      paper: "📄 ورقة",

      scissors: "✂️ مقص"

    };


    let message = "";

    if(gameResult.winner === "draw") {

      message =
        "🤝 تعادل!";

    }
    else if(gameResult.winner === myPlayer) {

      message =
        "🎉 أنت كسبت!";

      myScore++;

    }
    else {

      message =
        "😅 اللاعب الثاني كسب!";

      opponentScore++;

    }


    myScoreEl.textContent =
      myScore;

    opponentScoreEl.textContent =
      opponentScore;


    result.innerHTML = `

      <div>${message}</div>

      <div style="
        margin-top:15px;
        font-size:18px;
        line-height:2;
      ">

        أنت:
        <strong>${names[myChoice]}</strong>

        <br>

        اللاعب الثاني:
        <strong>${names[opponentChoice]}</strong>

      </div>

    `;


    status.textContent =
      "🏁 انتهت الجولة";

    againBtn.classList.remove("hidden");

  }


  /* =====================================================
     NEW ROUND
     ===================================================== */

  againBtn.addEventListener("click", async () => {

    const roomRef =
      ref(
        db,
        "rooms/" + currentRoom
      );

    try {

      /*
        تصفير الاختيارات والنتيجة
        وبدء جولة جديدة.
      */

      await update(roomRef, {

        "player1/choice": null,

        "player2/choice": null,

        result: null,

        status: "playing"

      });

      result.classList.add("hidden");

      choicesArea.classList.remove("hidden");

      againBtn.classList.add("hidden");

      status.textContent =
        "🎯 اختار حجر أو ورقة أو مقص";

      disableChoices(false);

    }
    catch(error) {

      console.error(error);

      alert("حدث خطأ أثناء بدء الجولة الجديدة");

    }

  });


  /* =====================================================
     DISABLE CHOICES
     ===================================================== */

  function disableChoices(disabled) {

    document
      .querySelectorAll(".choice")
      .forEach(button => {

        button.disabled = disabled;

      });

  }


  /* =====================================================
     COPY ROOM
     ===================================================== */

  copyBtn.addEventListener("click", async () => {

    try {

      await navigator.clipboard.writeText(
        currentRoom
      );

      copyBtn.textContent =
        "✅ تم نسخ الكود";

      setTimeout(() => {

        copyBtn.textContent =
          "📋 نسخ كود الغرفة";

      }, 1500);

    }
    catch {

      alert(
        "كود الغرفة: " +
        currentRoom
      );

    }

  });


  /* =====================================================
     LEAVE ROOM
     ===================================================== */

  leaveBtn.addEventListener("click", async () => {

    if(!currentRoom) {

      location.reload();

      return;

    }

    const playerRef =
      ref(
        db,
        `rooms/${currentRoom}/${myPlayer}`
      );

    try {

      await remove(playerRef);

    }
    catch(error) {

      console.error(error);

    }

    location.reload();

  });

</script>

</body>
</html>
