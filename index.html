<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveDuel</title>
    
    <!-- كود إعلانات Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7633556467552627" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    
    <style>
        :root { --bg-gradient: linear-gradient(135deg, #fce7f3, #fae8ff, #f3e8ff); --card-bg: rgba(255, 255, 255, 0.95); --primary-pink: #db2777; --accent-purple: #9333ea; --text-main: #4a044e; --border-color: #fbcfe8; --danger: #ef4444; }
        body { background: var(--bg-gradient); color: var(--text-main); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; margin: 0; }
        .app-container { width: 100%; max-width: 480px; }
        .game-screen { display: none; }
        .game-screen.active { display: block; }
        .hero-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 20px; padding: 25px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: var(--primary-pink); margin-bottom: 5px; }
        .primary-btn { background: linear-gradient(135deg, var(--primary-pink), var(--accent-purple)); color: #fff; border: none; padding: 12px 20px; border-radius: 12px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
        input { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: 10px; margin: 10px 0; box-sizing: border-box; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الشاشة الرئيسية -->
        <section id="screen-home" class="game-screen active">
            <div class="hero-card">
                <h1>LoveDuel</h1>
                <p>لعبة التحدي والأسئلة</p>
                <input type="text" id="create-name" placeholder="اكتب اسمك">
                <button class="primary-btn" onclick="createRoom()">إنشاء لعبة</button>
                <hr style="margin: 20px 0;">
                <input type="text" id="join-name" placeholder="اكتب اسمك">
                <input type="text" id="join-code" placeholder="كود الغرفة">
                <button class="primary-btn" onclick="joinRoom()">دخول الغرفة</button>
            </div>
        </section>

        <!-- شاشة الانتظار -->
        <section id="screen-waiting" class="game-screen">
            <div class="hero-card">
                <h2>في انتظار الطرف الآخر...</h2>
                <div id="code-display" style="font-size: 2rem; font-weight: bold; color: var(--accent-purple);">...</div>
            </div>
        </section>
    </div>

    <script>
        let peer, conn;
        
        // إعدادات قوية للاتصال بين أي شبكات (داتا وواي فاي)
        const peerIceConfig = {
            config: {
                'iceServers': [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' }
                ]
            }
        };

        function createRoom() {
            const randomId = Math.floor(1000 + Math.random() * 9000).toString();
            peer = new Peer('loveduel-' + randomId, peerIceConfig);
            
            peer.on('open', () => {
                document.getElementById('code-display').innerText = randomId;
                document.getElementById('screen-home').classList.remove('active');
                document.getElementById('screen-waiting').classList.add('active');
            });

            peer.on('connection', (c) => { conn = c; alert("تم الاتصال باللاعب الآخر!"); });
        }

        function joinRoom() {
            const code = document.getElementById('join-code').value;
            peer = new Peer(peerIceConfig);
            
            peer.on('open', () => {
                conn = peer.connect('loveduel-' + code);
                conn.on('open', () => { alert("تم الانضمام للغرفة!"); });
            });
        }
    </script>
</body>
</html>
